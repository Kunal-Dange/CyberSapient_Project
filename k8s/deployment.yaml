apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: nonprod
  labels:
    app: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: 730335383329.dkr.ecr.us-east-1.amazonaws.com/cybersapient-ecr-repo:nonprod-develop
          ports:
            - containerPort: 80
  