services:
  audit-agent:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    env_file: .env
    environment:
      DATABASE_PATH: /app/data/audits.db
    volumes:
      - audit-data:/app/data
      # Local development only. Prefer an AWS task/instance role in deployed environments.
      - ${HOME}/.aws:/home/app/.aws:ro
volumes:
  audit-data:
