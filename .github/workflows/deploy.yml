name: AWS Deployment

on:
  push:
    branches:
      - main
      - develop

permissions:
  id-token: write     # Required for OIDC
  contents: read      

jobs:
  sts:
    runs-on: ubuntu-latest
    outputs:
      aws_access_key_id: ${{ steps.sts.outputs.aws_access_key_id }}
      aws_secret_access_key: ${{ steps.sts.outputs.aws_secret_access_key }}
      aws_session_token: ${{ steps.sts.outputs.aws_session_token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  

      - name: Test AWS command
        run: |
          aws sts get-caller-identity
          aws s3 ls

      - name: Assume IAM Role
        id: sts
        run: |
          CREDS=$(aws sts assume-role \
            --role-arn "arn:aws:iam::730335383329:role/Kubernetes" \
            --role-session-name github-actions-session)

          echo "::set-output name=aws_access_key_id::$(echo $CREDS | jq -r '.Credentials.AccessKeyId')"
          echo "::set-output name=aws_secret_access_key::$(echo $CREDS | jq -r '.Credentials.SecretAccessKey')"
          echo "::set-output name=aws_session_token::$(echo $CREDS | jq -r '.Credentials.SessionToken')"

      - name: Set Environment Name
        id: env
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          if [ "$BRANCH_NAME" == "main" ]; then
            echo "env=prod" >> $GITHUB_OUTPUT
          else
            echo "env=nonprod" >> $GITHUB_OUTPUT
          fi

  docker-build-push-ecr:
    name: Build & Push Docker Image to ECR
    runs-on: ubuntu-latest

    if: |
      contains(github.event.head_commit.message, 'docker') ||
      github.event_name == 'push' && (
        contains(github.event.commits.*.modified, 'frontend/') || contains(github.event.commits.*.modified, 'Dockerfile')
      )

    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'nonproduction' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        run: |
          aws ecr get-login-password --region ${{ secrets.AWS_REGION }} | docker login --username AWS --password-stdin ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com

      - name: Set Image Tag Variables
        id: vars
        run: |
          BRANCH_NAME=${GITHUB_REF##*/}
          if [[ "$BRANCH_NAME" == "main" ]]; then
            ENV="prod"
          else
            ENV="nonprod"
          fi
          echo "REPO_NAME=cybersapient-ecr-repo" >> $GITHUB_OUTPUT
          echo "TAG=${ENV}-${BRANCH_NAME}" >> $GITHUB_OUTPUT
          echo "REGISTRY=${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ secrets.AWS_REGION }}.amazonaws.com" >> $GITHUB_OUTPUT

      - name: Build and Push Docker image to ECR
        run: |
          IMAGE_URI=${{ steps.vars.outputs.REGISTRY }}/${{ steps.vars.outputs.REPO_NAME }}:${{ steps.vars.outputs.TAG }}
          docker build -t $IMAGE_URI .
          docker push $IMAGE_URI

  terraform-plan:
    runs-on: ubuntu-latest
    needs: sts

    if: |
      github.event_name == 'push' && (
        contains(github.event.commits.*.modified, 'terraform/') || contains(github.event.head_commit.message, 'terraform')
      )

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure assumed role credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.sts.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ needs.sts.outputs.aws_secret_access_key }}
          aws-session-token: ${{ needs.sts.outputs.aws_session_token }}
          aws-region: us-east-1
      - name: Set environment variable from branch
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [ "$BRANCH_NAME" == "main" ]; then
            echo "TF_VAR_environment=prod" >> $GITHUB_ENV
          else
            echo "TF_VAR_environment=nonprod" >> $GITHUB_ENV
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6
      - name: Terraform init
        run: terraform init
        working-directory: terraform
      - run: terraform plan -out=tfplan
        working-directory: terraform
      - uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: terraform/tfplan

  terraform-apply:
    needs: sts
    runs-on: ubuntu-latest

    if: |
      github.event_name == 'push' && (
        contains(github.event.commits.*.modified, 'terraform/') || contains(github.event.head_commit.message, 'terraform')
      )

    environment:
      name: staging
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure assumed role credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.sts.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ needs.sts.outputs.aws_secret_access_key }}
          aws-session-token: ${{ needs.sts.outputs.aws_session_token }}
          aws-region: us-east-1
      - name: Set environment variable from branch
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [ "$BRANCH_NAME" == "main" ]; then
            echo "TF_VAR_environment=prod" >> $GITHUB_ENV
          else
            echo "TF_VAR_environment=nonprod" >> $GITHUB_ENV
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6 

      - name: Terraform init
        run: terraform init
        working-directory: terraform

      - uses: actions/download-artifact@v4
        with:
          name: tfplan
          path: terraform
      - run: terraform apply -auto-approve 
        working-directory: terraform


