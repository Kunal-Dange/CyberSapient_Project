  helm-deploy:
    name: Deploy App with Helm
    runs-on: ubuntu-latest
    needs: sts

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Environment
        id: env
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          if [ "$BRANCH_NAME" = "main" ]; then
            echo "environment=prod" >> $GITHUB_OUTPUT
            echo "values_file=values-prod.yaml" >> $GITHUB_OUTPUT
            echo "image_tag=prod-main" >> $GITHUB_OUTPUT
          else
            echo "environment=nonprod" >> $GITHUB_OUTPUT
            echo "values_file=values-nonprod.yaml" >> $GITHUB_OUTPUT
            echo "image_tag=nonprod-${BRANCH_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Configure AWS credentials using OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::730335383329:role/GitHubActionsEKSRole
          aws-region: ${{ secrets.AWS_REGION }}
          role-session-name: github-actions-session

      - name: Update kubeconfig for EKS
        run: |
          mkdir -p $HOME/.kube
          aws eks update-kubeconfig --region us-east-1 --name ${{ steps.env.outputs.environment }}-cluster --kubeconfig $HOME/.kube/config
        env:
          AWS_REGION: us-east-1
      - name: Set current context
        run: |
          kubectl config set-context --current --namespace nonprod
        env:
          KUBECONFIG: $HOME/.kube/config
      
      - name: Validate cluster access
        run: |
          echo "Current context:"
          kubectl config current-context
          kubectl get nodes
        env:
          KUBECONFIG: $HOME/.kube/config
  
      - name: Deploy using Helm
        run: |
          helm upgrade --install frontend ./terraform/helm \
            -f terraform/helm/${{ steps.env.outputs.values_file }} \
            --namespace ${{ steps.env.outputs.environment }} \
            --create-namespace
        env:
          KUBECONFIG: $HOME/.kube/config
