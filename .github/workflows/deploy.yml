name: AWS Deployment

on:
  push:
    branches:
      - main
      - develop

jobs:
  sts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  

      - name: Test AWS command
        run: |
          aws sts get-caller-identity
          aws s3 ls

  terraform_plan:
    needs: sts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure assumed role credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.sts.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ needs.sts.outputs.aws_secret_access_key }}
          aws-session-token: ${{ needs.sts.outputs.aws_session_token }}
          aws-region: ap-south-1

      - name: Confirm identity
        run: aws sts get-caller-identity