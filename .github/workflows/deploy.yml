name: AWS Deployment

on:
  push:
    branches:
      - main
      - develop

jobs:
  sts:
    runs-on: ubuntu-latest
    outputs:
      aws_access_key_id: ${{ steps.sts.outputs.aws_access_key_id }}
      aws_secret_access_key: ${{ steps.sts.outputs.aws_secret_access_key }}
      aws_session_token: ${{ steps.sts.outputs.aws_session_token }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1  

      - name: Test AWS command
        run: |
          aws sts get-caller-identity
          aws s3 ls

      - name: Assume role and set outputs
        id: sts
        run: |
          CREDS=$(aws sts sts \
            --role-arn "arn:aws:iam::730335383329:role/Kubernetes" \
            --role-session-name github-actions-session)

          echo "::set-output name=aws_access_key_id::$(echo $CREDS | jq -r '.Credentials.AccessKeyId')"
          echo "::set-output name=aws_secret_access_key::$(echo $CREDS | jq -r '.Credentials.SecretAccessKey')"
          echo "::set-output name=aws_session_token::$(echo $CREDS | jq -r '.Credentials.SessionToken')"

  terraform_plan:
    needs: sts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure assumed role credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.sts.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ needs.sts.outputs.aws_secret_access_key }}
          aws-session-token: ${{ needs.sts.outputs.aws_session_token }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Terraform init
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        run: terraform plan
        working-directory: terraform

  terraform-approve:
    name: Terraform Plan
    needs: sts
    runs-on: ubuntu-latest
    if: |
      github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop'

    environment: ${{ github.ref == 'refs/heads/develop' && 'Staging' || '' }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set environment directory
        id: setenv
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "tf_dir=terraform/nonprod" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            echo "tf_dir=terraform/dev" >> $GITHUB_OUTPUT
          fi

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.sts.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ needs.sts.outputs.aws_secret_access_key }}
          aws-session-token: ${{ needs.sts.outputs.aws_session_token }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init
        working-directory: ${{ steps.setenv.outputs.tf_dir }}

      - name: Terraform Plan
        run: terraform plan -out=tfplan
        working-directory: ${{ steps.setenv.outputs.tf_dir }}



  terraform-apply:
    name: Terraform Apply
    needs: terraform-approve
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.6.6

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ needs.terraform-approve.outputs.aws_access_key_id }}
          aws-secret-access-key: ${{ needs.terraform-approve.outputs.aws_secret_access_key }}
          aws-session-token: ${{ needs.terraform-approve.outputs.aws_session_token }}
          aws-region: ap-south-1

      - name: Terraform Init
        run: terraform init
        working-directory: terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan
        working-directory: terraform